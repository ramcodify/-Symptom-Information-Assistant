[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-symptom-assistant"
version = "1.0.0"
description = "Safe, informational healthcare assistant powered by LangGraph, MCP tools, and RAG knowledge base."
readme = "README.md"
authors = [{ name = "MediSafe AI Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-core>=1.6.0",
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1"
]

[project.scripts]
medisafe-cli = "app.cli:interactive_loop"
medisafe-server = "run_server:start"
medisafe-eval = "run_eval:main"
